services:
  - type: web
    name: docforge
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_APP_NAME
        value: DocForge
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: MAX_FILES_PER_UPLOAD
        value: 50
